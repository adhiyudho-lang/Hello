name: Deploy dashboard

# Publishes the dashboard to GitHub Pages on every push to the default branch.
# Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: ["claude/crypto-whale-dashboard", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan file situs
        run: |
          mkdir -p _site
          cp index.html engine.js app.js .nojekyll _site/
          cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
