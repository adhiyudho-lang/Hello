name: Perbarui GitHub Pages

# Pushes from apps and bots don't always rebuild GitHub Pages ("deploy from a branch"),
# so ask for a build whenever the dashboard code changes.
on:
  push:
    paths:
      - "index.html"
      - "engine.js"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Minta build Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
