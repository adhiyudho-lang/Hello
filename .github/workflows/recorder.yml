name: Rekam data whale

# Every hour: record ~55 minutes of signals with the same rules as the dashboard and
# collect price outcomes (1h/4h/24h) into a journal, then merge that journal onto the
# newest data/ and commit it. Merging after a fresh fetch means overlapping or delayed
# runs never overwrite each other's data. Data older than 30 days is removed.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: whale-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      JOURNAL: ${{ runner.temp }}/recorder-out.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rekam sinyal
        timeout-minutes: 63
        run: node recorder/record.cjs
        env:
          RUN_MINUTES: "55"

      - name: Simpan ke repo
        if: always()
        env:
          KEEP_DAYS: "30"
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "whale-recorder[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            node recorder/record.cjs merge "$JOURNAL"
            git add -A data
            if git diff --cached --quiet; then echo "Tidak ada data baru"; exit 0; fi
            git commit -q -m "Data whale $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
          done
          exit 1

      # Pushes made by this workflow don't rebuild GitHub Pages on their own; ask for a build
      # so the site (and any dashboard update) stays current.
      - name: Perbarui GitHub Pages
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed"
